<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>my-go-exchange · 行情终端</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">M</span>
      <div>
        <div class="title">my-go-exchange</div>
        <div class="subtitle">期货行情终端 · CTP → JetStream</div>
      </div>
    </div>
    <div class="status-group">
      <div class="pill"><span class="dot" id="wsDot"></span><span id="wsText">连接中…</span></div>
      <div class="pill mono" id="frontText">—</div>
      <div class="pill mono" id="streamText">MD_TICKS</div>
      <div class="pill mono" id="clock">--:--:--</div>
    </div>
  </header>

  <main class="layout">
    <section class="panel list-panel">
      <div class="panel-head">
        <h2>合约</h2>
        <span class="muted" id="quoteCount">0</span>
      </div>
      <div class="table-wrap">
        <table class="quote-table" id="quoteTable">
          <thead>
            <tr>
              <th>合约</th>
              <th>最新</th>
              <th>涨跌</th>
              <th>买一</th>
              <th>卖一</th>
              <th>成交量</th>
            </tr>
          </thead>
          <tbody id="quoteBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel detail-panel">
      <div class="panel-head">
        <h2 id="detailSymbol">选择合约</h2>
        <div class="detail-price">
          <span class="last" id="detailLast">—</span>
          <span class="chg" id="detailChg"></span>
        </div>
      </div>
      <div class="detail-grid" id="detailGrid"></div>
      <div class="chart-wrap">
        <div class="chart-label">1 分钟 K 线</div>
        <canvas id="kline" width="900" height="280"></canvas>
      </div>
    </section>

    <section class="panel tape-panel">
      <div class="panel-head">
        <h2>逐笔</h2>
        <span class="muted">live tape</span>
      </div>
      <div class="tape" id="tape"></div>
    </section>
  </main>

  <footer class="foot">
    <span>Source: Python CTP bridge · Pipeline: Go md-ingest · Bus: NATS JetStream</span>
    <span class="muted" id="totalTicks">ticks: 0</span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
